---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: credentials.configs.rc.ayaka.io
spec:
  group: configs.rc.ayaka.io
  names:
    kind: Credential
    listKind: CredentialList
    plural: credentials
    singular: credential
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Credential is the Schema for the credentials API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Credential
            properties:
              httpBasicAuth:
                description: httpBasicAuth configures HTTP Basic authentication.
                properties:
                  passwordRef:
                    description: |-
                      passwordRef selects the password or token from a Secret in the same
                      namespace.
                    properties:
                      key:
                        description: key is the key of the Secret data entry containing
                          the credential.
                        minLength: 1
                        type: string
                      name:
                        description: name is the name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  username:
                    description: username is presented as the HTTP Basic authentication
                      username.
                    minLength: 1
                    type: string
                required:
                - passwordRef
                - username
                type: object
              httpBearerToken:
                description: httpBearerToken configures HTTP Bearer token authentication.
                properties:
                  tokenRef:
                    description: tokenRef selects the Bearer token from a Secret in
                      the same namespace.
                    properties:
                      key:
                        description: key is the key of the Secret data entry containing
                          the credential.
                        minLength: 1
                        type: string
                      name:
                        description: name is the name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - tokenRef
                type: object
              httpHeaders:
                description: httpHeaders configures named secret HTTP request headers.
                properties:
                  headers:
                    description: headers are the HTTP headers presented to the remote
                      system.
                    items:
                      description: HTTPHeader identifies one HTTP header whose value
                        comes from a Secret.
                      properties:
                        name:
                          description: name is the HTTP header name.
                          pattern: ^[A-Za-z][A-Za-z0-9-]*$
                          type: string
                        valueRef:
                          description: valueRef selects the header value from a Secret
                            in the same namespace.
                          properties:
                            key:
                              description: key is the key of the Secret data entry
                                containing the credential.
                              minLength: 1
                              type: string
                            name:
                              description: name is the name of the Secret.
                              minLength: 1
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      required:
                      - name
                      - valueRef
                      type: object
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                required:
                - headers
                type: object
              process:
                description: process configures file and environment projections for
                  explicitly selected processes.
                properties:
                  envs:
                    description: |-
                      envs project non-secret literal environment variables. Explicit process
                      environment variables take precedence.
                    items:
                      description: |-
                        CredentialEnv projects one non-secret literal environment variable when a
                        Credential is selected for a process.
                      properties:
                        name:
                          description: name is the environment variable name.
                          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                          type: string
                        value:
                          description: value is the literal environment variable value.
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  files:
                    description: files project raw Secret data to process-scoped paths.
                    items:
                      description: CredentialFile projects raw Secret data to one
                        process-scoped path.
                      properties:
                        dataRef:
                          description: dataRef selects the raw file bytes from a Secret
                            in the same namespace.
                          properties:
                            key:
                              description: key is the key of the Secret data entry
                                containing the credential.
                              minLength: 1
                              type: string
                            name:
                              description: name is the name of the Secret.
                              minLength: 1
                              type: string
                          required:
                          - key
                          - name
                          type: object
                        mountPath:
                          description: mountPath is the absolute file path exposed
                            while the process is alive.
                          pattern: ^/.*
                          type: string
                      required:
                      - dataRef
                      - mountPath
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - mountPath
                    x-kubernetes-list-type: map
                type: object
                x-kubernetes-validations:
                - message: at least one file or env entry is required
                  rule: (has(self.files) && size(self.files) > 0) || (has(self.envs)
                    && size(self.envs) > 0)
              sshPrivateKey:
                description: sshPrivateKey configures SSH private key authentication.
                properties:
                  config:
                    description: |-
                      config is an OpenSSH client configuration fragment. rc replaces the
                      ${identityFile} and ${knownHostsFile} placeholders with process-scoped
                      credential paths before exposing the fragment through ~/.ssh/config.
                      The fragment must not contain secret values.
                    maxLength: 65536
                    type: string
                  knownHostsRef:
                    description: |-
                      knownHostsRef selects trusted SSH host keys from a Secret in the same
                      namespace.
                    properties:
                      key:
                        description: key is the key of the Secret data entry containing
                          the credential.
                        minLength: 1
                        type: string
                      name:
                        description: name is the name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  privateKeyRef:
                    description: privateKeyRef selects the private key from a Secret
                      in the same namespace.
                    properties:
                      key:
                        description: key is the key of the Secret data entry containing
                          the credential.
                        minLength: 1
                        type: string
                      name:
                        description: name is the name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - knownHostsRef
                - privateKeyRef
                type: object
              type:
                description: type describes how consumers present the referenced secret
                  data.
                enum:
                - SSHPrivateKey
                - HTTPBasicAuth
                - HTTPBearerToken
                - HTTPHeaders
                - Process
                type: string
            required:
            - type
            type: object
            x-kubernetes-validations:
            - message: sshPrivateKey must be set exactly when type is SSHPrivateKey
              rule: 'self.type == ''SSHPrivateKey'' ? has(self.sshPrivateKey) : !has(self.sshPrivateKey)'
            - message: httpBasicAuth must be set exactly when type is HTTPBasicAuth
              rule: 'self.type == ''HTTPBasicAuth'' ? has(self.httpBasicAuth) : !has(self.httpBasicAuth)'
            - message: httpBearerToken must be set exactly when type is HTTPBearerToken
              rule: 'self.type == ''HTTPBearerToken'' ? has(self.httpBearerToken)
                : !has(self.httpBearerToken)'
            - message: httpHeaders must be set exactly when type is HTTPHeaders
              rule: 'self.type == ''HTTPHeaders'' ? has(self.httpHeaders) : !has(self.httpHeaders)'
            - message: process must be set exactly when type is Process
              rule: 'self.type == ''Process'' ? has(self.process) : !has(self.process)'
          status:
            description: status defines the observed state of Credential
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the Credential resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
