---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: repositories.repositories.rc.ayaka.io
spec:
  group: repositories.rc.ayaka.io
  names:
    kind: Repository
    listKind: RepositoryList
    plural: repositories
    singular: repository
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='StorageReady')].status
      name: Ready
      type: string
    - jsonPath: .spec.remote.url
      name: Remote
      type: string
    - jsonPath: .spec.ref
      name: Ref
      type: string
    - jsonPath: .status.lastUpdatedAt
      name: Updated
      type: date
    - jsonPath: .status.volumeClaimName
      name: Volume
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Repository is the Schema for the repositories API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Repository
            properties:
              ref:
                description: |-
                  ref selects a full Git ref, or a full SHA-1 or SHA-256 commit. When
                  omitted, the remote's default branch is used.
                maxLength: 1024
                pattern: ^(refs/.+|[0-9A-Fa-f]{40}|[0-9A-Fa-f]{64})$
                type: string
              remote:
                description: remote identifies the Git remote synchronized into the
                  Repository.
                properties:
                  allowInsecureHTTP:
                    description: allowInsecureHTTP explicitly permits an unencrypted
                      HTTP remote.
                    type: boolean
                  credentialRef:
                    description: credentialRef selects a Credential in the same namespace.
                    properties:
                      name:
                        description: name is the name of the Credential.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  url:
                    description: url is the Git remote URL.
                    maxLength: 4096
                    minLength: 1
                    type: string
                required:
                - url
                type: object
                x-kubernetes-validations:
                - message: allowInsecureHTTP must be true for an http:// remote
                  rule: '!self.url.matches(''(?i)^http://'') || (has(self.allowInsecureHTTP)
                    && self.allowInsecureHTTP)'
                - message: allowInsecureHTTP may only be set for an http:// remote
                  rule: '!has(self.allowInsecureHTTP) || !self.allowInsecureHTTP ||
                    self.url.matches(''(?i)^http://'')'
              storage:
                description: storage configures the persistent parent volume.
                properties:
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    description: size is the requested capacity of the parent volume.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    description: storageClassName is the StorageClass used to provision
                      the parent volume.
                    minLength: 1
                    type: string
                required:
                - size
                - storageClassName
                type: object
                x-kubernetes-validations:
                - message: size must be greater than zero
                  rule: quantity(self.size).isGreaterThan(quantity('0'))
            required:
            - remote
            - storage
            type: object
          status:
            description: status defines the observed state of Repository
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the Repository resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastUpdatedAt:
                description: |-
                  lastUpdatedAt is the completion time of the last successful Git
                  synchronization Job that updated the parent volume.
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the latest Repository generation reflected by this
                  status. This is Kubernetes object bookkeeping, not a Repository data
                  generation.
                format: int64
                type: integer
              volumeClaimName:
                description: volumeClaimName is the name of the parent PersistentVolumeClaim.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
