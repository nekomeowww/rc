name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  test-windows:
    permissions:
      contents: read
    name: Run on Windows
    runs-on: windows-2025
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          New-Item -ItemType Directory -Force bin/windows-amd64 | Out-Null
          go build -trimpath -o bin/windows-amd64/rc-kube.exe ./cmd/rc-kube
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -o bin/windows-amd64/rcctl.exe ./cmd/rcctl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

  test-integration:
    permissions:
      contents: read
    name: Controller integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test with envtest
        run: make test-integration
