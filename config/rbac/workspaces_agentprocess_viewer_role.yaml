# This rule is not used by the project rc itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to workspaces.rc.ayaka.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: rc
    app.kubernetes.io/managed-by: kustomize
  name: workspaces-agentprocess-viewer-role
rules:
- apiGroups:
  - workspaces.rc.ayaka.io
  resources:
  - agentprocesses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - workspaces.rc.ayaka.io
  resources:
  - agentprocesses/status
  verbs:
  - get
