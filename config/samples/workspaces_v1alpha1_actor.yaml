apiVersion: workspaces.rc.ayaka.io/v1alpha1
kind: Actor
metadata:
  labels:
    app.kubernetes.io/name: rc
    app.kubernetes.io/managed-by: kustomize
  name: actor-sample
spec:
  terminal: true
  maxRunDuration: 2h
  idleTimeout: 30m
  profile:
    inline: |
      extends: builtin:opencode
      actor:
        workspace:
          path: ~/workspace
          from: "executor:dev:~/project"
          writable: true
      commands:
        - { match: "**", to: dev }
  # env reaches the driving program; a Secret key stays out of the profile.
  # env:
  # - name: OPENAI_API_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: openai
  #       key: api-key
  # pod places the runner Pod within the manager's KVM nodes.
  # pod:
  #   nodeSelector:
  #     topology.kubernetes.io/zone: zone-a
  executors:
  - name: dev
    workspaceRef:
      name: workspace-sample
