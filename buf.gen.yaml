# Generates the Go SDK from the protos in apis/proto. needy's protos set no
# go_package, so managed mode places them under apis/sdk/go.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/nekomeowww/rc/apis/sdk/go
inputs:
  - directory: apis/proto
plugins:
  - local: protoc-gen-go
    out: apis/sdk/go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: apis/sdk/go
    opt: paths=source_relative
