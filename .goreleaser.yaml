version: 2

project_name: rcctl

before:
  hooks:
    - make build-installer INSTALLER_OUTPUT=install.yaml IMG={{ .Env.CONTROLLER_IMAGE }}:{{ .Version }} RUNNER_IMG={{ .Env.RUNNER_IMAGE }}:{{ .Version }}

builds:
  - id: rcctl
    main: ./cmd/rcctl
    binary: rcctl
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - rcctl
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: rcctl
    ids:
      - rcctl
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: rcctl
    ids:
      - rcctl
    binaries:
      - rcctl
    homepage: https://github.com/nekomeowww/rc
    description: Manage persistent Kubernetes-backed development workspaces for coding agents
    url:
      template: https://github.com/nekomeowww/rc/releases/download/{{ .Tag }}/{{ .ArtifactName }}
    skip_upload: true
    repository:
      owner: nekomeowww
      name: homebrew-rc

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  extra_files:
    - glob: install.yaml
