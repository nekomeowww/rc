name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test-windows:
    permissions:
      contents: read
    name: Run on Windows
    runs-on: windows-2025
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          go build -o rc-kube.exe ./cmd/rc-kube
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -o rcctl.exe ./cmd/rcctl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        run: |
          go test -timeout 120s `
            ./internal/agentprocess `
            ./internal/cli/rcctl/commands/credentials/importcredential `
            ./internal/lifecycle `
            ./internal/osprocess `
            ./internal/rckube `
            ./internal/rcnative `
            ./internal/rcplatform
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test
