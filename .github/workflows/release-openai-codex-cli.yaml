name: Release OpenAI Codex CLI image

on:
  workflow_dispatch:
    inputs:
      codex_version:
        description: Version of @openai/codex to publish
        required: true
        default: '0.147.0'
        type: string
      runner_version:
        description: Released rc runner version to extend
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ inputs.codex_version }}-${{ inputs.runner_version }}

permissions:
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Validate Codex version
        env:
          CODEX_VERSION: ${{ inputs.codex_version }}
        shell: bash
        run: |
          if [[ ! "${CODEX_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "codex_version must be a semantic version without a leading v." >&2
            exit 1
          fi

      - name: Validate runner version
        env:
          RUNNER_VERSION: ${{ inputs.runner_version }}
        shell: bash
        run: |
          if [[ ! "${RUNNER_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "runner_version must be a semantic version without a leading v." >&2
            exit 1
          fi

      - name: Clone the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Generate image metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/openai-codex-cli
          flavor: |
            latest=true
          tags: |
            type=raw,value=${{ inputs.codex_version }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 OpenAI Codex CLI smoke image
        env:
          CODEX_VERSION: ${{ inputs.codex_version }}
          RUNNER_VERSION: ${{ inputs.runner_version }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file images/openai-codex-cli/Dockerfile \
            --build-arg "CODEX_VERSION=${CODEX_VERSION}" \
            --build-arg "RUNNER_IMAGE=ghcr.io/${GITHUB_REPOSITORY}/runner:${RUNNER_VERSION}" \
            --tag rc-openai-codex-cli:smoke \
            --cache-from type=gha \
            --load \
            images/openai-codex-cli

      - name: Smoke test OpenAI Codex CLI native build toolchain
        run: |
          smoke="${RUNNER_TEMP}/rc-native-toolchain-smoke"
          mkdir -p "${smoke}"
          printf '%s\n' \
            '{"name":"rc-native-toolchain-smoke","version":"1.0.0","private":true,"gypfile":true}' \
            > "${smoke}/package.json"
          printf '%s\n' \
            '{"targets":[{"target_name":"smoke","sources":["smoke.cc"]}]}' \
            > "${smoke}/binding.gyp"
          cat > "${smoke}/smoke.cc" <<'EOF'
          #include <node_api.h>
          napi_value Answer(napi_env env, napi_callback_info info) {
            napi_value result;
            napi_create_int32(env, 42, &result);
            return result;
          }
          napi_value Init(napi_env env, napi_value exports) {
            napi_value answer;
            napi_create_function(env, "answer", NAPI_AUTO_LENGTH, Answer, nullptr, &answer);
            napi_set_named_property(env, exports, "answer", answer);
            return exports;
          }
          NAPI_MODULE(NODE_GYP_MODULE_NAME, Init)
          EOF
          docker run --rm \
            --user 1000:1000 \
            --volume "${smoke}:/smoke" \
            --entrypoint /bin/bash \
            rc-openai-codex-cli:smoke \
            -euo pipefail -c '
              python3 --version
              g++ --version
              make --version
              cmake --version
              pkg-config --version
              cd /smoke
              npm install --foreground-scripts --no-audit --no-fund
              node -e "if (require(\"./build/Release/smoke.node\").answer() !== 42) process.exit(1)"
            '

      - name: Build and publish OpenAI Codex CLI
        id: push
        uses: docker/build-push-action@v6
        with:
          context: images/openai-codex-cli
          file: images/openai-codex-cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CODEX_VERSION=${{ inputs.codex_version }}
            RUNNER_IMAGE=ghcr.io/${{ github.repository }}/runner:${{ inputs.runner_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest the OpenAI Codex CLI image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/openai-codex-cli
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
