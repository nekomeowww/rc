name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require a version tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "Release must run against a v-prefixed tag." >&2
            exit 1
          fi

      - name: Clone the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Publish rcctl and the operator install manifest
        uses: goreleaser/goreleaser-action@v7 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.15.2
          args: release --clean
        env:
          CONTROLLER_IMAGE: ghcr.io/${{ github.repository }}/controller
          RUNNER_IMAGE: ghcr.io/${{ github.repository }}/runner
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs:
      - publish
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: controller
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
          - component: runner
            dockerfile: Dockerfile.runner
            platforms: linux/amd64,linux/arm64
          - component: runner-wayland
            dockerfile: images/runner-wayland/Dockerfile
            platforms: linux/amd64
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Generate image metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.component }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest ${{ matrix.component }} image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  docker-windows:
    runs-on: windows-2025
    needs:
      - publish
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build Windows runtime binaries
        run: |
          New-Item -ItemType Directory -Force bin/windows-amd64 | Out-Null
          go build -trimpath -o bin/windows-amd64/rc-kube.exe ./cmd/rc-kube
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -o bin/windows-amd64/rcctl.exe ./cmd/rcctl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare Windows runner assets
        run: ./images/runner-windows/prepare-ci-assets.ps1 -RCBinaryDirectory bin/windows-amd64

      - name: Start Windows Docker
        run: |
          if ((Get-Service docker).Status -ne 'Running') {
            Start-Service docker
          }
          docker info
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Windows runner
        id: push
        env:
          IMAGE: ghcr.io/${{ github.repository }}/runner-windows
          VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          $parts = $version.Split('.')
          $minorVersion = "$($parts[0]).$($parts[1])"

          docker build --target runner `
            --tag "$($env:IMAGE):$version" `
            --tag "$($env:IMAGE):$minorVersion" `
            --tag "$($env:IMAGE):latest" `
            images/runner-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker push --all-tags $env:IMAGE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker pull "$($env:IMAGE):$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $reference = docker image inspect "$($env:IMAGE):$version" --format '{{index .RepoDigests 0}}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = ($reference -split '@', 2)[1]
          if (-not $digest) { throw 'Published Windows image has no repository digest' }
          "digest=$digest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Attest Windows runner image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/runner-windows
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
