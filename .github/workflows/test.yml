name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  test-windows:
    permissions:
      contents: read
    name: Run on Windows
    runs-on: windows-2025
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          New-Item -ItemType Directory -Force bin/windows-amd64 | Out-Null
          go build -trimpath -o bin/windows-amd64/rc-kube.exe ./cmd/rc-kube
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -o bin/windows-amd64/rcctl.exe ./cmd/rcctl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        run: |
          go test -timeout 120s `
            ./internal/agentprocess `
            ./internal/cli/rcctl/commands/credentials/importcredential `
            ./internal/lifecycle `
            ./internal/osprocess `
            ./internal/rckube `
            ./internal/rcnative `
            ./internal/rcplatform
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare Windows runner assets
        run: ./images/runner-windows/prepare-ci-assets.ps1 -RCBinaryDirectory bin/windows-amd64 -IncludeCodex

      - name: Free space on the disposable Windows runner
        run: |
          # These host SDKs are unused: the image installs its own toolchain.
          # Keep Git, Go, Node and the Actions tool cache for subsequent steps.
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'Only run on a disposable GitHub runner' }
          Get-PSDrive C, D | Select-Object Name, Used, Free
          foreach ($path in @('C:\Program Files\Microsoft Visual Studio', 'C:\Program Files (x86)\Microsoft Visual Studio', 'C:\Program Files (x86)\Windows Kits', 'C:\Program Files\dotnet', 'C:\Android')) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Continue
            }
          }
          Get-PSDrive C, D | Select-Object Name, Used, Free

      - name: Start Windows Docker
        run: |
          if ((Get-Service docker).Status -ne 'Running') {
            Start-Service docker
          }
          docker info
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows runner and Codex images
        run: |
          docker build --target runner --tag rc-runner-windows:test images/runner-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker build --target codex --tag rc-codex-windows:test images/runner-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test
